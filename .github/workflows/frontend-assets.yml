name: Browser asset installation

on:
  push:
    paths:
      - 'app/frontend_assets.py'
      - 'tests/test_frontend_assets.py'
      - '.github/workflows/frontend-assets.yml'
  pull_request:
    paths:
      - 'app/frontend_assets.py'
      - 'tests/test_frontend_assets.py'
      - '.github/workflows/frontend-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test extraction, normalized paths, integrity and cached reuse
        run: python tests/test_frontend_assets.py
